name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checking out and running the checks is all this needs. Set here rather than per job, so a job
# added later starts read-only too.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `core/` imports neither `server/` nor `worker/`, and this is where that is enforced.
      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # The browser test starts its own `pnpm dev` and needs no database, which is why it can
      # run here without a compose stack.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
