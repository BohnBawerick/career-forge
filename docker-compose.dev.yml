# The whole development environment: Postgres and GoTrue, and nothing else (ADR 0005).
# Nuxt and the worker run on your own machine with `pnpm dev` and `pnpm worker`.
#
#   cp .env.example .env    # then replace the placeholders it lists at the top
#   docker compose -f docker-compose.dev.yml up

name: career-forge-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      GOTRUE_DB_USER: ${GOTRUE_DB_USER}
      GOTRUE_DB_PASSWORD: ${GOTRUE_DB_PASSWORD}
    ports:
      - "${DEV_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  gotrue:
    image: supabase/gotrue:v2.186.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: 9999
      API_EXTERNAL_URL: ${GOTRUE_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${GOTRUE_DB_USER}:${GOTRUE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?search_path=auth&sslmode=disable

      GOTRUE_SITE_URL: ${APP_URL}
      GOTRUE_URI_ALLOW_LIST: ${APP_URL}

      # Permanently off. career-forge owns the front door and creates every login through the
      # admin API (ADR 0007).
      GOTRUE_DISABLE_SIGNUP: "true"

      GOTRUE_JWT_SECRET: ${GOTRUE_JWT_SECRET}
      GOTRUE_JWT_EXP: ${GOTRUE_JWT_EXP:-3600}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role

      # v1 has no mail server, so an address is confirmed the moment it is created (ADR 0007).
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

      GOTRUE_LOG_LEVEL: ${GOTRUE_LOG_LEVEL:-info}
    ports:
      # Published only because `pnpm dev` runs Nuxt on your machine rather than in the network.
      # docker-compose.yml keeps this port inside the network, which is where ADR 0007 wants it.
      - "${DEV_BIND_ADDR:-127.0.0.1}:${GOTRUE_PORT:-9999}:9999"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
